<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .fur-base { fill: #E67E22; }
      .fur-ear { fill: #BA4A00; }
      .fur-cream { fill: #FDF2E9; }
      .collar { fill: #2E86C1; }
      .bell { fill: #F4D03F; }
      .feature { fill: #2C3E50; }
      .shine { fill: #FFFFFF; }
      .tongue { fill: #F1948A; }
      .cheek { fill: #F5B7B1; opacity: 0.6; }
      .stroke { stroke: #2C3E50; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

      /* Animations */
      .anim-shadow {
        transform-origin: 100px 172px;
        animation: shadow-pulse 2.2s ease-in-out infinite;
      }

      .anim-tail {
        transform-origin: 130px 138px;
        animation: tail-wag 0.32s ease-in-out infinite alternate;
      }

      .anim-body {
        transform-origin: 100px 162px;
        animation: body-breathe 2.2s ease-in-out infinite;
      }

      .anim-head {
        transform-origin: 100px 115px;
        animation: head-tilt 2.2s ease-in-out infinite;
      }

      .anim-ear-left {
        transform-origin: 64px 52px;
        animation: ear-flop 2.2s ease-in-out infinite;
      }

      .anim-ear-right {
        transform-origin: 134px 52px;
        animation: ear-perk 2.2s ease-in-out infinite;
      }

      .anim-eye-left {
        transform-origin: 78px 74px;
        animation: blink 3.8s infinite;
      }

      .anim-eye-right {
        transform-origin: 122px 74px;
        animation: blink 3.8s infinite;
      }

      .anim-brows {
        animation: brow-lift 2.2s ease-in-out infinite;
      }


      .anim-bell {
        transform-origin: 100px 120px;
        animation: bell-jingle 1.1s ease-in-out infinite alternate;
      }

      .anim-tuft {
        transform-origin: 100px 39px;
        animation: tuft-bounce 1.1s ease-in-out infinite alternate;
      }

      @keyframes shadow-pulse {
        0%, 100% { transform: scaleX(1); opacity: 1; }
        50% { transform: scaleX(1.04); opacity: 0.85; }
      }

      @keyframes tail-wag {
        0% { transform: rotate(-16deg); }
        100% { transform: rotate(20deg); }
      }

      @keyframes body-breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.025, 0.98); }
      }

      @keyframes head-tilt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        35% { transform: translateY(-2px) rotate(-2deg); }
        70% { transform: translateY(1px) rotate(2.5deg); }
      }

      @keyframes ear-flop {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-6deg); }
        70% { transform: rotate(4deg); }
      }

      @keyframes ear-perk {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(5deg); }
        70% { transform: rotate(-8deg); }
      }

      @keyframes blink {
        0%, 45%, 49%, 100% { transform: scaleY(1); }
        47% { transform: scaleY(0.08); }
      }

      @keyframes brow-lift {
        0%, 100% { transform: translateY(0px); }
        35% { transform: translateY(-2px); }
        70% { transform: translateY(0.5px); }
      }


      @keyframes bell-jingle {
        0% { transform: rotate(-14deg); }
        100% { transform: rotate(14deg); }
      }

      @keyframes tuft-bounce {
        0% { transform: rotate(-4deg); }
        100% { transform: rotate(5deg); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <ellipse class="anim-shadow" cx="100" cy="172" rx="52" ry="8" fill="#EBEDEF" />

  <!-- Wagging Tail -->
  <g class="anim-tail">
    <path class="fur-ear stroke" d="M 132 142 C 155 138, 168 118, 156 108 C 146 100, 140 122, 128 134 Z" />
  </g>

  <!-- Breathing Body & Paws -->
  <g class="anim-body">
    <!-- Body -->
    <path class="fur-base stroke" d="M 68 118 C 60 166, 140 166, 132 118 Z" />
    
    <!-- Cream Belly Patch -->
    <path class="fur-cream" d="M 80 126 C 75 158, 125 158, 120 126 Z" />

    <!-- Back Paws -->
    <ellipse class="fur-cream stroke" cx="64" cy="162" rx="13" ry="8" />
    <ellipse class="fur-cream stroke" cx="136" cy="162" rx="13" ry="8" />

    <!-- Front Legs -->
    <path class="fur-base stroke" d="M 79 134 L 79 160 A 9.5 9.5 0 0 0 98 160 L 98 134" />
    <path class="fur-base stroke" d="M 102 134 L 102 160 A 9.5 9.5 0 0 0 121 160 L 121 134" />
    
    <!-- Front White Socks -->
    <path class="fur-cream stroke" d="M 79 152 L 79 160 A 9.5 9.5 0 0 0 98 160 L 98 152 Z" />
    <path class="fur-cream stroke" d="M 102 152 L 102 160 A 9.5 9.5 0 0 0 121 160 L 121 152 Z" />

    <!-- Bandana: triangle with side knot and a bolt -->
    <path d="M 126 118 L 142 126 L 132 133 Z" fill="#117864" stroke="#2C3E50" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 74 118 L 58 126 L 68 133 Z" fill="#117864" stroke="#2C3E50" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 66 116 Q 100 128 134 116 L 100 162 Z" fill="#16A085" stroke="#2C3E50" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="131" cy="119" r="5" fill="#117864" stroke="#2C3E50" stroke-width="3"/>
    <path transform="translate(100 142) scale(0.4) translate(-33 -32)" d="M40 6 16 35h14l-6 23 26-31H35l5-21Z" fill="#F4D03F" stroke="#2C3E50" stroke-width="6" stroke-linejoin="round" paint-order="stroke"/>
    <g class="anim-bell">
      <circle class="bell stroke" cx="100" cy="124" r="5" />
    </g>
  </g>

  <!-- Tilting Head Group -->
  <g class="anim-head">
    <!-- Folded Left Ear -->
    <g class="anim-ear-left">
      <path class="fur-ear stroke" d="M 66 48 C 42 42, 32 76, 48 96 C 56 104, 66 92, 64 74 Z" />
    </g>

    <!-- Perked Right Ear -->
    <g class="anim-ear-right">
      <path class="fur-ear stroke" d="M 132 48 C 154 32, 172 64, 154 88 C 146 98, 136 86, 136 70 Z" />
    </g>

    <!-- Head -->
    <ellipse class="fur-base stroke" cx="100" cy="76" rx="45" ry="39" />

    <!-- Forehead Blaze & Muzzle Patch -->
    <path class="fur-cream" d="M 100 44 C 94 60, 82 74, 82 88 C 82 98, 118 98, 118 88 C 118 74, 106 60, 100 44 Z" />

    <!-- Animated Eyebrows -->
    <g class="anim-brows">
      <ellipse class="fur-cream" cx="80" cy="61" rx="4.5" ry="2.5" transform="rotate(-12 80 61)" />
      <ellipse class="fur-cream" cx="120" cy="61" rx="4.5" ry="2.5" transform="rotate(12 120 61)" />
    </g>

    <!-- Left Eye -->
    <g class="anim-eye-left">
      <circle class="feature" cx="78" cy="74" r="7.5" />
      <circle class="shine" cx="76" cy="71.5" r="2.8" />
      <circle class="shine" cx="80.5" cy="76.5" r="1.3" />
    </g>

    <!-- Right Eye -->
    <g class="anim-eye-right">
      <circle class="feature" cx="122" cy="74" r="7.5" />
      <circle class="shine" cx="120" cy="71.5" r="2.8" />
      <circle class="shine" cx="124.5" cy="76.5" r="1.3" />
    </g>

    <!-- Blush -->
    <ellipse class="cheek" cx="66" cy="86" rx="7" ry="4.5" />
    <ellipse class="cheek" cx="134" cy="86" rx="7" ry="4.5" />

    <!-- Mouth: a smile at rest. The open mouth scales with the mouth variable (0 closed to 1 open),
         which the app sets from the voice clip's lip-sync track (src/voice.js). Kept small and
         soft on purpose: a warm inside, a little tongue, no outline. -->
    <path class="stroke" fill="none" d="M 91 88 Q 95.5 93 100 87 Q 104.5 93 109 88" />
    <g class="mouth" style="transform-origin: 100px 88px; transform: scaleY(var(--mouth, 0)); transition: transform 60ms ease-out;">
      <path d="M 93 88 Q 100 103 107 88 Z" fill="#9B4A3C" />
      <path class="tongue" d="M 96.5 92 C 96.5 100, 103.5 100, 103.5 92 Z" />
    </g>

    <!-- Nose -->
    <ellipse class="feature" cx="100" cy="81" rx="6" ry="4.2" />
    <ellipse class="shine" cx="98" cy="79.5" rx="1.8" ry="1" />

    <!-- Bouncing Head Tuft -->
    <g class="anim-tuft">
      <path class="fur-base stroke" d="M 95 38 Q 100 28 103 37 Q 108 31 106 39" />
    </g>
  </g>
</svg>